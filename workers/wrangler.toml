# ============================================================
# Ds Platform · AI 帮写 外部控制网关
# Cloudflare Workers 配置
#
# 部署：wrangler deploy
# 子域名：api.youyuanqi.dpdns.org
# ============================================================

name = "ds-ai-assist-v2"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------------------------
# D1 数据库（复用现有 ds-platform 库）
# ------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "ds-platform"
database_id = "a805ce2c-8941-44f1-8c7c-62eaf02fb4b8"

# ------------------------------------------------------------
# Cloudflare 免费 AI（兜底模型池）
# ------------------------------------------------------------
[ai]
binding = "AI"

# ------------------------------------------------------------
# 环境变量
#
# ★ 安全提示：PLATFORM_ACCESS_KEY 不要写在 vars 里！
#   vars 是明文且会覆盖同名 secret。
#   正确做法是用 secret 存储：
#     wrangler secret put PLATFORM_ACCESS_KEY
# ------------------------------------------------------------
[vars]
API_PREFIX = "/api/v1"
# ★ 2026-09-13 架构纠正：已移除 PRISM_TUNNEL_URL。
#   Prism 跑在云手机内，被控端 127.0.0.1 直连后主动外连本网关。
#   网关不再依赖任何固定机器的隧道，用户电脑运行时完全不参与。

# 自定义域名
# 注意：如果 api.youyuanqi.dpdns.org 已被现有 worker 占用，
# 请改用 ai-api.youyuanqi.dpdns.org 或复用现有 worker 增加路由
routes = [
  { pattern = "ai-api.youyuanqi.dpdns.org/*", zone_name = "youyuanqi.dpdns.org" }
]
