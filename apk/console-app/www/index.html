<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prism 控制台</title>
<style>
  :root{--bg:#0d1117;--tx:#e6edf3;--pri:#4a9eff;--hint:#7d8590}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;text-align:center;
  }
  .box{max-width:340px}
  .logo{
    width:64px;height:64px;margin:0 auto 20px;border-radius:16px;
    background:linear-gradient(135deg,#4a9eff,#7c5cff);
    display:flex;align-items:center;justify-content:center;
    font-size:30px;font-weight:700;color:#fff;
  }
  h1{font-size:19px;font-weight:600;margin-bottom:10px}
  p{font-size:13.5px;color:var(--hint);line-height:1.7}
  .spin{
    width:22px;height:22px;margin:22px auto 0;
    border:2px solid rgba(255,255,255,.15);border-top-color:var(--pri);
    border-radius:50%;animation:r .8s linear infinite;
  }
  @keyframes r{to{transform:rotate(360deg)}}
  .url{
    margin-top:18px;padding:9px 12px;background:rgba(255,255,255,.05);
    border-radius:8px;font-size:11.5px;color:var(--hint);
    font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">P</div>
    <h1>Prism 控制台</h1>
    <p>正在连接控制台…</p>
    <div class="spin"></div>
    <div class="url">prism-console-7v1.pages.dev</div>
  </div>

<script>
  // 这个页面只是启动闪屏。
  // Capacitor 的 server.url 会把 WebView 直接指向线上控制台，
  // 所以正常情况下它一闪而过。
  //
  // 如果长时间停在这里，说明设备连不上 Pages（离线 / DNS 被墙），
  // 那就手动跳一次；还是不行就改用浏览器访问。
  setTimeout(function(){
    var target = 'https://prism-console-7v1.pages.dev/';
    if (location.href.indexOf('prism-console') === -1) {
      location.href = target;
    }
  }, 2500);
</script>
</body>
</html>
